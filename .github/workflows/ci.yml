name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate deployment scripts
        run: bash -n deploy/preflight.sh deploy/smoke-test.sh

      - name: Validate integration JSON contracts
        run: >-
          python3 -m json.tool integrations/n8n/contracts/event-envelope.schema.json >/dev/null &&
          python3 -m json.tool integrations/n8n/contracts/artifact-callback.schema.json >/dev/null &&
          python3 -m json.tool integrations/n8n/contracts/delivery-failure.schema.json >/dev/null &&
          python3 -m json.tool integrations/n8n/samples/invoice-issued.json >/dev/null

      - name: Restore
        run: dotnet restore ZibasheERP.slnx

      - name: Build
        run: dotnet build ZibasheERP.slnx --configuration Release --no-restore --warnaserror

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Verify migration snapshot
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project ZibasheERP.Infrastructure/ZibasheERP.Infrastructure.csproj
          --startup-project ZibasheERP.API/ZibasheERP.API.csproj
          --no-build
          --configuration Release

      - name: Run tests
        run: >-
          dotnet run
          --project ZibasheERP.Application.Tests/ZibasheERP.Application.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

  container-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: zibashe-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
